<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swift Moonlight Input Visual Target</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --panel: #101010;
      --line: #f4f4f4;
      --muted: #9a9a9a;
      --accent-a: #00e5ff;
      --accent-b: #ffcc00;
      --accent-c: #ff3355;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255,255,255,0.05) 1px, transparent 1px),
        var(--bg);
      background-size: 120px 120px;
      color: var(--line);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    .hud {
      position: fixed;
      left: 24px;
      top: 20px;
      z-index: 10;
      padding: 14px 16px;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(16,16,16,0.92);
      letter-spacing: 0.02em;
    }

    .hud strong {
      display: block;
      margin-bottom: 8px;
      font-size: 16px;
      text-transform: uppercase;
    }

    .hud span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .event-panel {
      position: fixed;
      right: 24px;
      top: 20px;
      z-index: 10;
      min-width: 260px;
      padding: 14px 16px;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(16,16,16,0.92);
      font-size: 12px;
      line-height: 1.6;
    }

    .event-panel strong {
      display: block;
      margin-bottom: 8px;
      font-size: 16px;
      text-transform: uppercase;
    }

    .axis {
      position: fixed;
      background: rgba(255,255,255,0.35);
      pointer-events: none;
    }

    .axis.horizontal {
      left: 0;
      top: 50%;
      width: 100%;
      height: 1px;
    }

    .axis.vertical.left {
      left: 25%;
      top: 0;
      width: 1px;
      height: 100%;
    }

    .axis.vertical.right {
      left: 75%;
      top: 0;
      width: 1px;
      height: 100%;
    }

    .target {
      position: fixed;
      width: 192px;
      height: 192px;
      margin-left: -96px;
      margin-top: -96px;
      border: 4px solid var(--line);
      background:
        linear-gradient(45deg, var(--accent-a) 0 25%, #000 25% 50%, var(--accent-b) 50% 75%, #000 75% 100%);
      box-shadow:
        0 0 0 8px rgba(0,0,0,0.8),
        0 0 0 10px rgba(255,255,255,0.75);
    }

    .target::before,
    .target::after {
      content: "";
      position: absolute;
      background: var(--line);
    }

    .target::before {
      left: 50%;
      top: -28px;
      width: 4px;
      height: 248px;
      margin-left: -2px;
    }

    .target::after {
      left: -28px;
      top: 50%;
      width: 248px;
      height: 4px;
      margin-top: -2px;
    }

    .target.left {
      left: 25%;
      top: 50%;
    }

    .target.right {
      left: 75%;
      top: 50%;
      background:
        linear-gradient(135deg, var(--accent-c) 0 25%, #000 25% 50%, var(--accent-a) 50% 75%, #000 75% 100%);
    }

    .label {
      position: absolute;
      left: 50%;
      bottom: -44px;
      transform: translateX(-50%);
      padding: 5px 8px;
      background: #000;
      border: 1px solid var(--line);
      font-size: 14px;
      white-space: nowrap;
    }

    .center-dot {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 24px;
      height: 24px;
      margin-left: -12px;
      margin-top: -12px;
      border-radius: 50%;
      background: var(--line);
      box-shadow: 0 0 0 6px #000, 0 0 0 8px var(--line);
    }

    .probe-cursor {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 20;
      width: 88px;
      height: 88px;
      margin-left: -44px;
      margin-top: -44px;
      border-radius: 50%;
      border: 6px solid #fff;
      background:
        radial-gradient(circle at 50% 50%, #fff 0 7px, transparent 8px),
        conic-gradient(from 45deg, var(--accent-c), var(--accent-b), var(--accent-a), var(--accent-c));
      box-shadow:
        0 0 0 6px #000,
        0 0 28px rgba(0, 229, 255, 0.9);
      pointer-events: none;
      transform: translate(var(--probe-x, 0px), var(--probe-y, 0px));
    }

    .probe-cursor::before,
    .probe-cursor::after {
      content: "";
      position: absolute;
      background: #000;
      border: 2px solid #fff;
    }

    .probe-cursor::before {
      left: 50%;
      top: -18px;
      width: 4px;
      height: 124px;
      margin-left: -4px;
    }

    .probe-cursor::after {
      left: -18px;
      top: 50%;
      width: 124px;
      height: 4px;
      margin-top: -4px;
    }

    .capture-sentinel {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 40;
      width: 320px;
      height: 64px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-right: 4px solid #000;
      border-bottom: 4px solid #000;
      pointer-events: none;
    }

    .capture-sentinel span:nth-child(1) { background: #ff00ff; }
    .capture-sentinel span:nth-child(2) { background: #00ff00; }
    .capture-sentinel span:nth-child(3) { background: #0066ff; }
    .capture-sentinel span:nth-child(4) { background: #ffffff; }
  </style>
</head>
<body>
  <main>
    <div class="capture-sentinel" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>
    <section class="hud">
      <strong>Input Visual Target</strong>
      <span>Open this page full-screen on the streamed host.</span>
      <span>Absolute probe moves: 25% center, then 75% center, then 50% center.</span>
      <span>Use with SWIFT_MOONLIGHT_CAPTURE_REQUIRE_INPUT_VISUAL_EXPECTED_REGIONS=1.</span>
    </section>
    <section class="event-panel">
      <strong>Host Pointer</strong>
      <div>x: <span id="x-value">50.00%</span></div>
      <div>y: <span id="y-value">50.00%</span></div>
      <div>events: <span id="event-count">0</span></div>
      <div>last: <span id="last-event">waiting</span></div>
    </section>
    <div class="axis horizontal"></div>
    <div class="axis vertical left"></div>
    <div class="axis vertical right"></div>
    <div class="target left"><div class="label">25% x / 50% y</div></div>
    <div class="target right"><div class="label">75% x / 50% y</div></div>
    <div class="center-dot"></div>
    <div class="probe-cursor" id="probe-cursor"></div>
  </main>
  <script>
    const root = document.documentElement;
    const xValue = document.getElementById("x-value");
    const yValue = document.getElementById("y-value");
    const eventCount = document.getElementById("event-count");
    const lastEvent = document.getElementById("last-event");
    let count = 0;

    function updateProbe(event) {
      const width = Math.max(1, window.innerWidth);
      const height = Math.max(1, window.innerHeight);
      const x = Math.max(0, Math.min(width, event.clientX));
      const y = Math.max(0, Math.min(height, event.clientY));
      const xPercent = (x / width) * 100;
      const yPercent = (y / height) * 100;

      root.style.setProperty("--probe-x", `${x - width / 2}px`);
      root.style.setProperty("--probe-y", `${y - height / 2}px`);
      xValue.textContent = `${xPercent.toFixed(2)}%`;
      yValue.textContent = `${yPercent.toFixed(2)}%`;
      eventCount.textContent = String(++count);
      lastEvent.textContent = event.type;
    }

    window.addEventListener("pointermove", updateProbe, { passive: true });
    window.addEventListener("mousemove", updateProbe, { passive: true });
    window.addEventListener("pointerdown", updateProbe, { passive: true });
    window.addEventListener("mousedown", updateProbe, { passive: true });
  </script>
</body>
</html>
